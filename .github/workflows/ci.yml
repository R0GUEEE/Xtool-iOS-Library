name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Resolve dependencies
        run: swift package resolve
      - name: Build package
        run: swift build
      - name: Run tests
        run: swift test

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Build XtoolMobileKit for iOS
        run: |
          set -o pipefail
          xcodebuild build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -scheme XtoolMobileKit \
            -destination generic/platform=iOS \
          | xcbeautify
