name: Native Toolchain

on:
  workflow_dispatch:
    inputs:
      llvm_ref:
        description: LLVM tag or revision
        required: true
        default: llvmorg-21.1.2
      deployment_target:
        description: Minimum iOS version
        required: true
        default: "17.0"

jobs:
  llvm-ios:
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: brew install cmake ninja

      - name: Build LLVM Clang LLD for iOS
        env:
          LLVM_REF: ${{ inputs.llvm_ref }}
          IOS_DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
        run: |
          chmod +x Scripts/build-llvm-ios.sh
          Scripts/build-llvm-ios.sh

      - name: Package native toolchain
        run: |
          chmod +x Scripts/package-native-toolchain.sh
          Scripts/package-native-toolchain.sh

      - name: Upload native toolchain
        uses: actions/upload-artifact@v4
        with:
          name: XtoolNativeLLVM-ios-arm64
          path: .native-toolchain/XtoolNativeLLVM-ios-arm64.tar.gz
          if-no-files-found: error
