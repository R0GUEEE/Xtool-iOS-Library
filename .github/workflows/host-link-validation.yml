name: Host Link Validation

on:
  workflow_dispatch:
    inputs:
      compiler_tag:
        description: Compiler release tag, or latest
        required: true
        default: latest
  push:
    branches:
      - main
    paths:
      - "Support/SwiftFrontendAdapter.cpp"
      - "Support/ClangAdapter.cpp"
      - "Support/LLDMachOAdapter.cpp"
      - "Sources/CXtoolCompilerBridge/**"
      - "Scripts/link-host-probe-ios.sh"

jobs:
  link-ios-host:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Download prebuilt compiler release
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILER_TAG: ${{ inputs.compiler_tag || 'latest' }}
        run: |
          chmod +x Scripts/fetch-prebuilt-compiler.sh
          Scripts/fetch-prebuilt-compiler.sh             "$COMPILER_TAG"             .artifacts/toolchain

      - name: Link iOS compiler host probe
        env:
          TOOLCHAIN_ROOT: ${{ github.workspace }}/.artifacts/toolchain
          IOS_DEPLOYMENT_TARGET: "17.0"
        run: |
          chmod +x Scripts/link-host-probe-ios.sh
          Scripts/link-host-probe-ios.sh

      - name: Upload linker diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: XtoolHostLinkDiagnostics
          path: .host-link-probe/linker-errors.txt
          if-no-files-found: ignore

      - name: Upload host-link probe
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XtoolCompilerHostProbe-ios-arm64
          path: .host-link-probe/XtoolCompilerHostProbe
          if-no-files-found: error
