name: Native Host App

on:
  workflow_dispatch:
    inputs:
      compiler_tag:
        description: Compiler release tag, or latest
        required: true
        default: latest
  push:
    branches:
      - main
    paths:
      - "Examples/NativeHostApp/**"
      - "Sources/XtoolMobileKit/**"
      - "Sources/CXtoolCompilerBridge/**"
      - "Support/**"

jobs:
  build-host-app:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Install prebuilt compiler release
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILER_TAG: ${{ inputs.compiler_tag || 'latest' }}
        run: |
          chmod +x Scripts/fetch-prebuilt-compiler.sh
          Scripts/fetch-prebuilt-compiler.sh             "$COMPILER_TAG"             Examples/NativeHostApp/Vendor/XtoolUnifiedCompiler

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Examples/NativeHostApp
        run: xcodegen generate

      - name: Build unsigned iOS host app
        working-directory: Examples/NativeHostApp
        run: |
          set -o pipefail
          xcodebuild build             -project XtoolNativeHostApp.xcodeproj             -scheme XtoolNativeHostApp             -destination generic/platform=iOS             CODE_SIGNING_ALLOWED=NO             | xcbeautify

      - name: Package unsigned host app
        working-directory: Examples/NativeHostApp
        run: |
          APP="$(find ~/Library/Developer/Xcode/DerivedData             -type d -path '*/Build/Products/Debug-iphoneos/XtoolNativeHostApp.app'             | head -n 1)"
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent             "$APP"             XtoolNativeHostApp-unsigned.zip

      - name: Upload unsigned host app
        uses: actions/upload-artifact@v4
        with:
          name: XtoolNativeHostApp-unsigned
          path: Examples/NativeHostApp/XtoolNativeHostApp-unsigned.zip
          if-no-files-found: error
